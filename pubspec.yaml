name: engage_flutter
description: The official Flutter SDK for Engage push notifications, in-app experiences, feature flags, and message center.
version: 2.1.1
homepage: https://github.com/mathias8dev/engage-flutter
repository: https://github.com/mathias8dev/engage-flutter
issue_tracker: https://github.com/mathias8dev/engage-flutter/issues

topics:
  - notifications
  - push-notifications
  - engagement
  - feature-flags
  - in-app-messaging

environment:
  sdk: ^3.11.3
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.engage.engage_flutter
        pluginClass: EngageFlutterPlugin
      ios:
        pluginClass: EngageFlutterPlugin
