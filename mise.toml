[tools]
flutter = "3.41.5"
java = "temurin-21"

[env]
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"
ANDROID_SDK_ROOT = "{{ get_env(name='ANDROID_SDK_ROOT', default=get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk')) }}"

[tasks."hooks:install"]
description = "Enable the repository-owned Git hooks"
run = "./scripts/install-git-hooks.sh"

[tasks.bootstrap]
description = "Resolve Flutter dependencies"
run = [
    "flutter config --enable-swift-package-manager",
    "flutter pub get",
]

[tasks.check]
description = "Format-check, analyze, and test the Flutter and native Android bridges"
depends = ["bootstrap"]
run = [
    "./scripts/validate-version.sh",
    "dart format --output=none --set-exit-if-changed lib test example/lib",
    "flutter analyze",
    "flutter test",
    "cd example/android && ./gradlew :engage_flutter:testDebugUnitTest",
]

[tasks."package:check"]
description = "Run all checks and validate the exact pub.dev archive"
depends = ["check"]
run = "dart pub publish --dry-run"

[tasks."build:android"]
description = "Compile the example application for Android"
depends = ["bootstrap"]
dir = "example/android"
run = '''
release_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' ../../pubspec.yaml | head -n 1)"
timestamp="$(date -u +%y%m%d%H%M)"
./gradlew assembleDebug -PengageFlutterVersion="$release_version-$timestamp"
'''

[tasks."build:ios"]
description = "Compile the example application for the iOS simulator"
depends = ["bootstrap"]
dir = "example"
run = "flutter build ios --simulator --no-codesign"

[tasks."publish:first"]
description = "Manually create the package on pub.dev; required exactly once before OIDC releases"
confirm = "Publish the first engage_flutter version to pub.dev?"
run = "./scripts/publish-first.sh"

[tasks.release]
description = "Release the version declared in pubspec.yaml"
confirm = "Create and push this Flutter SDK release tag?"
run = "./scripts/release.sh"
