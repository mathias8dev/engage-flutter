name: engage_flutter_example
description: Demonstrates the Engage Flutter SDK.
publish_to: none

environment:
  sdk: ^3.11.3

dependencies:
  engage_flutter:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
